name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.10
      - run: mise run ci

  deploy:
    name: Deploy to Fly.io
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: fly-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.10
      - run: mise run deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
